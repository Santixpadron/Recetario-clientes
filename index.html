<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="UmamiLab: laboratorio de exploración y comparación gastronómica con recetas de TheMealDB.">
  <title>UmamiLab — Exploración y comparación gastronómica</title>
  <link rel="icon" href="assets/ingrediente-default.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="saltar-contenido" href="#contenido-principal">Saltar al contenido principal</a>

  <header id="contenedor-navegacion" class="cabecera-principal"></header>

  <main id="contenido-principal" class="contenedor-principal" tabindex="-1">
    <div id="contenedor-vista" aria-live="polite"></div>
  </main>

  <footer class="pie-pagina">
    <p><strong>UmamiLab</strong> — Laboratorio Gastronómico SPA impulsado por TheMealDB API</p>
    <p>HTML5, CSS3 y JavaScript vanilla.</p>
  </footer>

  <div id="contenedor-dialogo"></div>
  <div id="region-anuncios" class="solo-lectores" role="status" aria-live="polite"></div>

  <!-- 1. Servicios -->
  <script src="js/servicios/cache.js"></script>
  <script src="js/servicios/recetas.js"></script>
  <script src="js/servicios/api.js"></script>
  <script src="js/servicios/comparacion.js"></script>

  <!-- 2. Pseudocomponentes -->
  <script src="js/componentes/EstadoCarga.js"></script>
  <script src="js/componentes/BarraNavegacion.js"></script>
  <script src="js/componentes/TarjetaReceta.js"></script>
  <script src="js/componentes/Paginador.js"></script>
  <script src="js/componentes/FormularioBusqueda.js"></script>
  <script src="js/componentes/ListaIngredientes.js"></script>
  <script src="js/componentes/PasosPreparacion.js"></script>
  <script src="js/componentes/PanelComparador.js"></script>
  <script src="js/componentes/TablaComparacion.js"></script>

  <!-- 3. Vistas -->
  <script src="js/vistas/VistaInicio.js"></script>
  <script src="js/vistas/VistaExplorar.js"></script>
  <script src="js/vistas/VistaDetalle.js"></script>
  <script src="js/vistas/VistaCategoriasOrigenes.js"></script>
  <script src="js/vistas/VistaComparador.js"></script>

  <!-- 4. Punto de entrada -->
  <script src="js/app.js"></script>
</body>
</html>
